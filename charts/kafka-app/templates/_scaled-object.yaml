{{- define "kafka-app.scaled-object" -}}
{{ if .Values.autoscaling.enabled }}
  {{- $autoscaling := .Values.autoscaling -}}
  {{- $uniqueId := coalesce .Values.kafka.applicationId .Values.kafka.groupId -}}
  {{- $kafkaTrigger := $autoscaling.kafkaTrigger | default dict -}}
  {{- $topics := concat (.Values.kafka.inputTopics | default list) -}}
  {{- range $autoscaling.internalTopics }}
  {{- $topics = append $topics (printf "%s-%s" $uniqueId .) -}}
  {{- end }}
  {{- $topics = concat $topics ($autoscaling.topics | default list) -}}
  {{- range $_, $labeledTopics := .Values.kafka.labeledInputTopics }}
  {{- $topics = concat $topics $labeledTopics -}}
  {{- end }}
  {{- $metadata := dict
      "bootstrapServers" .Values.kafka.bootstrapServers
      "consumerGroup" $uniqueId
      "lagThreshold" $autoscaling.lagThreshold
      "offsetResetPolicy" $autoscaling.offsetResetPolicy -}}
  {{- range $key, $value := $kafkaTrigger.metadata }}
  {{- $_ := set $metadata $key $value -}}
  {{- end }}
  {{- if and $autoscaling.triggers $autoscaling.additionalTriggers }}
  {{- fail "autoscaling.triggers and autoscaling.additionalTriggers cannot be used together" }}
  {{- end }}
  {{- if and $autoscaling.scalingModifiers (not $autoscaling.triggers) }}
  {{- fail "autoscaling.scalingModifiers requires autoscaling.triggers" }}
  {{- end }}
  {{- range $key, $_ := omit $kafkaTrigger "metadata" "authenticationRef" "metricType" "useCachedMetrics" }}
  {{- fail (printf "autoscaling.kafkaTrigger.%s is not supported, use one of metadata, authenticationRef, metricType, useCachedMetrics" $key) }}
  {{- end }}
  {{- if hasKey $metadata "topic" }}
  {{- fail "autoscaling.kafkaTrigger.metadata.topic cannot be set, as one trigger is generated per topic" }}
  {{- end }}
  {{- if not $autoscaling.triggers }}
  {{- if not (or $topics $autoscaling.additionalTriggers) }}
  {{- fail "To use autoscaling, you must define one of .Values.kafka.inputTopics, .Values.autoscaling.internalTopics, .Values.autoscaling.topics, .Values.kafka.labeledInputTopics, or .Values.autoscaling.additionalTriggers, or use autoscaling.triggers to define fully custom triggers" }}
  {{- end }}
  {{- if and $topics (not (and $metadata.consumerGroup $metadata.lagThreshold)) }}
  {{- fail "When autoscaling Kafka topics, you must set both .Values.kafka.applicationId (or .Values.kafka.groupId) and .Values.autoscaling.lagThreshold" }}
  {{- end }}
  {{- end }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "kafka-app.fullname" . }}
  {{- include "kafka-app.annotations" . }}
  labels:
    {{- include "kafka-app.labels" . | nindent 4 }}
    {{- range $key, $value := .Values.labels }}
    {{ $key | quote }}: {{ $value | quote }}
    {{- end }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: {{ ternary "StatefulSet" "Deployment" (.Values.statefulSet | default false) }}
    name: {{ include "kafka-app.fullname" . }}
  pollingInterval: {{ $autoscaling.pollingInterval }}
  cooldownPeriod: {{ $autoscaling.cooldownPeriod }}
  {{- with $autoscaling.initialCooldownPeriod }}
  initialCooldownPeriod: {{ . }}
  {{- end }}
  minReplicaCount: {{ $autoscaling.minReplicas }}
  maxReplicaCount: {{ $autoscaling.maxReplicas }}
  {{- if hasKey $autoscaling "idleReplicas" }}
  idleReplicaCount: {{ $autoscaling.idleReplicas }}
  {{- end }}
  {{- with $autoscaling.fallback }}
  fallback:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  triggers:
    {{- if $autoscaling.triggers }}
    {{- toYaml $autoscaling.triggers | nindent 4 }}
    {{- else }}
    {{- range $topics }}
    - type: kafka
      {{- with omit $kafkaTrigger "metadata" }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      metadata:
        topic: {{ . | quote }}
        {{- range $key, $value := $metadata }}
        {{- if not (kindIs "invalid" $value) }}
        {{- /* KEDA expects strings; toJson avoids scientific notation for large numbers */}}
        {{ $key }}: {{ ternary $value (toJson $value) (kindIs "string" $value) | quote }}
        {{- end }}
        {{- end }}
    {{- end }}
    {{- with $autoscaling.additionalTriggers }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- end }}
  advanced:
    {{- with $autoscaling.restoreToOriginalReplicaCount }}
    restoreToOriginalReplicaCount: {{ . }}
    {{- end }}
    horizontalPodAutoscalerConfig:
      name: {{ include "kafka-app.fullname" . }}
      {{- with $autoscaling.behavior }}
      behavior:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- with $autoscaling.scalingModifiers }}
    scalingModifiers:
      {{- toYaml . | nindent 6 }}
    {{- end }}
{{ end }}
{{- end -}}
