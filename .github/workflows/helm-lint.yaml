name: Helm lint

on:
  push:
    tags: [ "**" ]
    branches:
      - master
  pull_request:

jobs:
  helm-lint:
    runs-on: ubuntu-22.04
    steps:
      - name: Lint Helm chart
        uses: bakdata/ci-templates/actions/helm-lint@37079c092c50f7e75c206269b4388bf79f2a7a72 # https://github.com/bakdata/ci-templates/releases/tag/2.1.1
        with:
          lint-config-path: ".github/lint-config.yaml"
