name: Helm lint

on:
  push:
    tags: [ "**" ]
    branches:
      - master
  pull_request:

jobs:
  helm-lint:
    runs-on: ubuntu-22.04
    steps:
      - name: Lint Helm chart
        uses: bakdata/ci-templates/actions/helm-lint@dcb4d9d45060d891da1bc59f0657dceec112527c # https://github.com/bakdata/ci-templates/releases/tag/2.3.0
        with:
          lint-config-path: ".github/lint-config.yaml"
