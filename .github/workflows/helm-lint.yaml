name: Helm lint

on:
  push:
    tags: [ "**" ]
    branches:
      - master
  pull_request:

jobs:
  helm-lint:
    runs-on: ubuntu-22.04
    steps:
      - name: Lint Helm chart
        uses: bakdata/ci-templates/actions/helm-lint@b63a0925eccbdbf69dcf2c990c15cae4a1a8e9f7 # https://github.com/bakdata/ci-templates/releases/tag/2.1.0
        with:
          lint-config-path: ".github/lint-config.yaml"
