name: Publish Helm Charts

on:
  push:
    tags: [ "**" ]
    branches:
      - master
  pull_request:
  merge_group:

jobs:
  get-gradle-version:
    name: Get Gradle Version
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Check out repository
        uses: bakdata/ci-templates/actions/checkout@b63a0925eccbdbf69dcf2c990c15cae4a1a8e9f7 # https://github.com/bakdata/ci-templates/releases/tag/2.1.0

      - name: Set up Gradle with version ${{ inputs.gradle-version }}
        uses: bakdata/ci-templates/actions/java-gradle-setup@b63a0925eccbdbf69dcf2c990c15cae4a1a8e9f7 # https://github.com/bakdata/ci-templates/releases/tag/2.1.0
        with:
          gradle-cache-read-only: "true"

      - name: Get version
        id: get-version
        run: |
          version=$(./gradlew properties -q | grep "^version:" | awk '{print $2}' | tr -d '[:space:]' | xargs)
          echo "version=$version" >> "$GITHUB_OUTPUT"
        shell: bash


  helm-publish:
    name: Publish Helm chart
    uses: bakdata/ci-templates/.github/workflows/helm-multi-release.yaml@b63a0925eccbdbf69dcf2c990c15cae4a1a8e9f7 # https://github.com/bakdata/ci-templates/releases/tag/2.1.0
    needs: get-gradle-version
    with:
      charts-path: "./charts"
      subdirs: |
        [
          "producer-app",
          "producer-app-cleanup-job",
          "streams-app",
          "streams-app-cleanup-job",
          "consumer-app",
          "consumer-app-cleanup-job",
          "consumerproducer-app",
          "consumerproducer-app-cleanup-job",
        ]
      gh-pages-branch: gh-pages
      version: ${{ needs.get-gradle-version.outputs.version }}
    secrets:
      github-username: ${{ secrets.GH_USERNAME }}
      github-email: ${{ secrets.GH_EMAIL }}
      github-token: ${{ secrets.GH_TOKEN }}
